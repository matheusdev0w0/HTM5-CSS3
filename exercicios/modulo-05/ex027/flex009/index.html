<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>


        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
        .pai {
            background-color: antiquewhite;
            height: 600px; 
            display: flex;
            justify-content: space-around;
            padding: 15px;

        }
        .filha {
            flex-basis:400px;
            background-color: rgba(122, 72, 170, 0.849);
            padding: 15px;
            text-align: center;
           
        }
        
    </style>
</head>
<body>
    <div class="pai">
        <div class="filha">
            <p>div filha</p>
        </div>

        <div class="filha">
            <p>div filha</p>
        </div>
    </div>
</body>
</html>
